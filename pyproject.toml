[project]
name = "thief-agent"
version = "0.1.0"
description = "Thief peer for the P2P Police-Thief league (team amireman). Day-1 local-playable core."
requires-python = ">=3.13"
dependencies = [
    "fastmcp==3.4.5",
]

# Real Gmail sending (BLOCKED-EXTERNAL: needs credentials.json + OAuth). Install with
# `uv sync --extra gmail`. The core install and all tests run without these.
[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thief_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
